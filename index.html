<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>نشاط تفاعلي: بيان الأحكام الشرعية</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap');

        * {
            box-sizing: border-box;
            font-family: 'Tajawal', sans-serif;
            -webkit-user-select: none;
            user-select: none;
        }

        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            margin: 0;
            padding: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
        }

        .container {
            background-color: #ffffff;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            padding: 25px 15px;
            width: 100%;
            max-width: 900px;
            text-align: center;
        }

        h1 {
            color: #2c3e50;
            margin-bottom: 5px;
            font-size: 24px;
        }

        .instruction {
            color: #7f8c8d;
            font-size: 16px;
            margin-bottom: 20px;
        }

        .score-board {
            background-color: #ecf0f1;
            padding: 10px 20px;
            border-radius: 50px;
            display: inline-block;
            font-size: 18px;
            font-weight: bold;
            color: #2c3e50;
            margin-bottom: 20px;
            border: 2px dashed #bdc3c7;
        }

        .zones-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .zone {
            background-color: #f8f9fa;
            border: 3px dashed #bdc3c7;
            border-radius: 15px;
            padding: 15px;
            min-height: 200px;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .zone h2 {
            margin-top: 0;
            font-size: 20px;
            padding: 5px 15px;
            border-radius: 20px;
            color: #fff;
            width: 100%;
        }

        .zone-halal h2 { background-color: #2ecc71; }
        .zone-haram h2 { background-color: #e74c3c; }

        .zone.drag-over {
            border-color: #3498db;
            background-color: #ecf0f1;
        }

        .draggables-container {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: center;
            background-color: #f1f2f6;
            padding: 15px;
            border-radius: 15px;
            min-height: 100px;
            margin-bottom: 25px;
        }

        .draggable {
            background-color: #ffffff;
            color: #2c3e50;
            padding: 12px 18px;
            border-radius: 10px;
            cursor: grab;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            border: 2px solid #e2e8f0;
            font-weight: 500;
            font-size: 15px;
            touch-action: none; /* لمنع المتصفح الافتراضي من التدخل */
            -webkit-touch-callout: none; /* لمنع ظهور قائمة الـ الحفظ في الآيفون عند الضغط المطول */
        }

        .draggable.dragging {
            opacity: 0.6;
        }

        /* ستايل الآيفون والموبايل أثناء السحب */
        .draggable.mobile-dragging {
            position: fixed !important;
            z-index: 9999 !important;
            pointer-events: none !important;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3) !important;
            transform: scale(1.05);
        }

        .correct {
            border-color: #2ecc71 !important;
            background-color: #eafaf1 !important;
            color: #27ae60 !important;
        }

        .incorrect {
            border-color: #e74c3c !important;
            background-color: #fdedec !important;
            color: #c0392b !important;
            animation: shake 0.5s ease;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-6px); }
            40%, 80% { transform: translateX(6px); }
        }

        .action-buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
        }

        .btn {
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 16px;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .btn-submit { background-color: #3498db; }
        .btn-reset { background-color: #7f8c8d; }
        .btn:disabled { background-color: #bdc3c7; cursor: not-allowed; }
    </style>
</head>
<body>

<div class="container">
    <h1> بَيِّنِ الحُكْمَ الشَّرْعِيَّ</h1>
    <p class="instruction">اسحب المسائل وضعها داخل المربعات، ثم اضغط "تأكيد الإجابة"!</p>

    <div class="score-board" id="score-display">الدرجة: -- / 6</div>

    <div class="zones-container">
        <div class="zone zone-halal" data-verdict="halal">
            <h2>جائز / مباح 👍</h2>
        </div>
        <div class="zone zone-haram" data-verdict="haram">
            <h2>محرم ❌</h2>
        </div>
    </div>

    <div class="draggables-container" id="items-pool">
        <div class="draggable" draggable="true" id="item1" data-correct="haram">استعمال آنية الذهب</div>
        <div class="draggable" draggable="true" id="item2" data-correct="halal">استعمال إناء مضبب بضبة من فضة للضرورة</div>
        <div class="draggable" draggable="true" id="item3" data-correct="haram">اقتناء إناء من ذهب</div>
        <div class="draggable" draggable="true" id="item4" data-correct="halal">استعمال إناء من لؤلؤ</div>
        <div class="draggable" draggable="true" id="item5" data-correct="haram">خاتم الذهب للرجال</div>
        <div class="draggable" draggable="true" id="item6" data-correct="halal">خاتم الذهب للنساء</div>
    </div>

    <div class="action-buttons">
        <button class="btn btn-submit" id="submit-btn" onclick="checkAnswers()">تأكيد الإجابة 🎯</button>
        <button class="btn btn-reset" onclick="resetActivity()">إعادة من جديد 🔄</button>
    </div>
</div>

<script>
    const draggables = document.querySelectorAll('.draggable');
    const zones = document.querySelectorAll('.zone');
    const pool = document.getElementById('items-pool');
    const scoreDisplay = document.getElementById('score-display');
    const submitBtn = document.getElementById('submit-btn');

    window.addEventListener('DOMContentLoaded', () => {
        shuffleItems();
        setupMobileTouch(); // تشغيل النظام المخصص للآيفون والموبايل
    });

    // --- نظام اللمس المطور لحل مشكلة السحب على الآيفون (iOS Touch Handler) ---
    function setupMobileTouch() {
        draggables.forEach(item => {
            let startX, startY;
            let offsetX = 0, offsetY = 0;

            item.addEventListener('touchstart', function(e) {
                if (item.getAttribute('draggable') === 'false') return;
                
                // منع فتح القوائم المنبثقة أو سحب الصفحة في السفاري
                e.stopPropagation();

                const touch = e.touches[0];
                const rect = item.getBoundingClientRect();
                
                // حساب المسافة بين مكان اللمس وزاوية الكارت لعدم حدوث قفزة عند البدء
                offsetX = touch.clientX - rect.left;
                offsetY = touch.clientY - rect.top;

                // تثبيت حجم الكارت الحالي قبل تحويله لـ fixed لئلا يتشوه شكله في الآيفون
                item.style.width = rect.width + 'px';
                item.style.height = rect.height + 'px';
                
                item.classList.add('mobile-dragging');
                
                // وضعه مباشرة تحت الإصبع
                item.style.left = (touch.clientX - offsetX) + 'px';
                item.style.top = (touch.clientY - offsetY) + 'px';
            }, { passive: false });

            item.addEventListener('touchmove', function(e) {
                if (!item.classList.contains('mobile-dragging')) return;
                
                // السطر الأهم للآيفون: يمنع الشاشة من الاهتزاز أو النزول لأسفل أثناء السحب
                e.preventDefault(); 
                e.stopPropagation();

                const touch = e.touches[0];
                
                item.style.left = (touch.clientX - offsetX) + 'px';
                item.style.top = (touch.clientY - offsetY) + 'px';

                // كشف المنطقة التي يقف فوقها الإصبع حالياً لتفعيل تأثير الإضاءة (Hover تأثير)
                const elem = document.elementFromPoint(touch.clientX, touch.clientY);
                const currentZone = elem ? elem.closest('.zone') : null;
                
                zones.forEach(z => z.classList.remove('drag-over'));
                if (currentZone) currentZone.classList.add('drag-over');
            }, { passive: false });

            item.addEventListener('touchend', function(e) {
                if (!item.classList.contains('mobile-dragging')) return;
                e.stopPropagation();

                item.classList.remove('mobile-dragging');
                
                // تنظيف الستايلات المؤقتة للسحب
                item.style.position = '';
                item.style.left = '';
                item.style.top = '';
                item.style.width = '';
                item.style.height = '';

                // تحديد أين تم الإفلات بالاعتماد على آخر نقطة لمسها الإصبع
                const touch = e.changedTouches[0];
                const elem = document.elementFromPoint(touch.clientX, touch.clientY);
                
                const targetZone = elem ? elem.closest('.zone') : null;
                const targetPool = elem ? elem.closest('#items-pool') : null;

                zones.forEach(z => z.classList.remove('drag-over'));

                if (targetZone) {
                    targetZone.appendChild(item);
                } else if (targetPool) {
                    targetPool.appendChild(item);
                } else {
                    pool.appendChild(item); // يرجع للمنتصف إذا أفلت في مكان فارغ
                }
                item.classList.remove('correct', 'incorrect');
            });
        });
    }

    // --- دعم الماوس العادي للكمبيوتر واللاب توب ---
    draggables.forEach(draggable => {
        draggable.addEventListener('dragstart', () => {
            if (draggable.getAttribute('draggable') === 'true') draggable.classList.add('dragging');
        });
        draggable.addEventListener('dragend', () => draggable.classList.remove('dragging'));
    });

    pool.addEventListener('dragover', (e) => e.preventDefault());
    pool.addEventListener('drop', (e) => {
        e.preventDefault();
        const draggingItem = document.querySelector('.dragging');
        if (draggingItem) {
            pool.appendChild(draggingItem);
            draggingItem.classList.remove('correct', 'incorrect');
        }
    });

    zones.forEach(zone => {
        zone.addEventListener('dragover', (e) => {
            e.preventDefault();
            zone.classList.add('drag-over');
        });
        zone.addEventListener('dragleave', () => zone.classList.remove('drag-over'));
        zone.addEventListener('drop', (e) => {
            e.preventDefault();
            zone.classList.remove('drag-over');
            const draggingItem = document.querySelector('.dragging');
            if (draggingItem) {
                zone.appendChild(draggingItem);
                draggingItem.classList.remove('correct', 'incorrect');
            }
        });
    });

    // --- منطق احتساب الدرجات ---
    function checkAnswers() {
        let correctCount = 0;
        let totalItems = draggables.length;

        if (pool.children.length > 0) {
            alert('برجاء تصنيف جميع البطاقات أولاً قبل تأكيد الإجابة!');
            return;
        }

        zones.forEach(zone => {
            const targetVerdict = zone.getAttribute('data-verdict');
            const itemsInZone = zone.querySelectorAll('.draggable');

            itemsInZone.forEach(item => {
                const correctVerdict = item.getAttribute('data-correct');

                if (correctVerdict === targetVerdict) {
                    item.classList.remove('incorrect');
                    item.classList.add('correct');
                    item.setAttribute('draggable', 'false'); 
                    correctCount++;
                } else {
                    item.classList.add('incorrect');
                    setTimeout(() => {
                        pool.appendChild(item);
                        item.classList.remove('incorrect');
                    }, 1200); 
                }
            });
        });

        scoreDisplay.textContent = `الدرجة: ${correctCount} / ${totalItems}`;

        if (correctCount === totalItems) {
            scoreDisplay.style.backgroundColor = '#2ecc71';
            scoreDisplay.style.color = '#fff';
            scoreDisplay.textContent = `أحسنت! الإجابات كلها صحيحة 🎉 (6 / 6)`;
            submitBtn.disabled = true;
        } else {
            scoreDisplay.style.backgroundColor = '#e67e22';
            scoreDisplay.style.color = '#fff';
            alert(`لقد حصلت على ${correctCount} من 6. تم إرجاع الإجابات الخاطئة لتجربتها مجدداً! 💪`);
        }
    }

    function shuffleItems() {
        for (let i = pool.children.length; i >= 0; i--) {
            pool.appendChild(pool.children[Math.random() * i | 0]);
        }
    }

    function resetActivity() {
        draggables.forEach(item => {
            item.classList.remove('correct', 'incorrect');
            item.setAttribute('draggable', 'true');
            pool.appendChild(item);
        });
        scoreDisplay.textContent = "الدرجة: -- / 6";
        scoreDisplay.style.backgroundColor = "#ecf0f1";
        scoreDisplay.style.color = "#2c3e50";
        submitBtn.disabled = false;
        shuffleItems();
    }
</script>

</body>
</html>
